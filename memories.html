<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memories for Habiba</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-memories">
  <div class="page-shell">
    <header class="site-header">
      <a class="brand-mark" href="index.html" aria-label="Habiba">
        <span class="brand-flower">✦</span>
      </a>
    </header>

    <main class="memories-wrap">
      <section class="memory-story">
        <div class="memory-intro reveal-text">
          <p class="intro-message">Just a little reminder of how much you mean to me. ❤️</p>
        </div>

        <div class="memory-album" id="memoryAlbum">
          <article class="memory-photo memory-photo-1 reveal-photo" data-delay="0">
            <figure class="photo-frame">
              <img src="assets/images/photo1.jpg.jpeg" alt="A memory with Habiba" class="memory-image" />
              <figcaption class="memory-caption">Your smile makes everything better. ❤️</figcaption>
            </figure>
          </article>

          <article class="memory-photo memory-photo-2 reveal-photo" data-delay="500">
            <figure class="photo-frame">
              <img src="assets/images/photo2.jpg.jpeg" alt="A memory with Habiba" class="memory-image" />
              <figcaption class="memory-caption">One of my favorite people in this world.</figcaption>
            </figure>
          </article>

          <article class="memory-photo memory-photo-3 reveal-photo" data-delay="1000">
            <figure class="photo-frame">
              <img src="assets/images/photo3.jpg.jpeg" alt="A memory with Habiba" class="memory-image" />
              <figcaption class="memory-caption">You make ordinary moments feel special.</figcaption>
            </figure>
          </article>

          <article class="memory-photo memory-photo-4 reveal-photo" data-delay="1500">
            <figure class="photo-frame">
              <img src="assets/images/photo4.jpg.jpeg" alt="A memory with Habiba" class="memory-image" />
              <figcaption class="memory-caption">Some people just make life better by being in it. ❤️</figcaption>
            </figure>
          </article>
        </div>

        <section class="final-message-wrap">
          <div class="final-message-block">
            <p class="final-message">And this is just a little reminder…<br><br>
              You are more special than you probably realize.<br>
              I hope I can always be one of the reasons you smile. ❤️</p>

            <div class="heart-line" aria-label="Love animation">
              <span class="heart-pulse">♥</span>
              <span class="heart-pulse">♥</span>
              <span class="heart-pulse">♥</span>
            </div>
          </div>
        </section>

        <section class="music-section">
          <button class="music-button" id="musicToggle">
            <span class="music-icon">🎵</span>
            <span class="music-text">Play our song</span>
          </button>
          <audio id="memorySong" src="assets/music/Ed Sheeran - Perfect.mp3" preload="auto"></audio>
        </section>
      </section>
    </main>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
